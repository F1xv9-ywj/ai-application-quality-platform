[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "Reproducible quality engineering toolkit for RAG and chat applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EvalForge contributors"}]
dependencies = ["fastapi>=0.141.1,<1", "httpx>=0.28.1,<1", "pydantic>=2.13.4,<3", "uvicorn>=0.52.4,<1"]

[project.optional-dependencies]
dev = ["mypy>=2.3.1,<3", "pre-commit>=4.6.2,<5", "pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.16.4,<1"]
load = ["locust>=2.46.3,<3"]
e2e = ["playwright>=1.62.0,<2"]

[project.scripts]
evalforge = "evalforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not e2e'"
testpaths = ["tests"]
markers = ["unit: isolated unit tests", "contract: API schema and validation tests", "eval: evaluator and metric tests", "integration: multi-component tests", "e2e: browser tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evalforge"]
mypy_path = "src"

[tool.coverage.run]
source = ["evalforge"]
[tool.coverage.report]
fail_under = 85
show_missing = true
